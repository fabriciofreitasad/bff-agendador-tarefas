services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  bff-agendador-tarefas:
    build: ./bff-agendador-tarefas
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8081:8080"]

  agendador-tarefas:
    build: ./agendador-tarefas
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8082:8080"]

  notificacao:
    build: ./notificacao
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8083:8080"]

  usuario:
    build: ./usuario
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports: ["8084:8080"]
